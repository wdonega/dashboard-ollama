services:
  dashboard:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - dashboard_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NUXT_OLLAMA_HOST=http://localhost:11434
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  dashboard_node_modules:
